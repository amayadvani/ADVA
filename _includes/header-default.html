<header class="header-site" role="banner">
  <div class="content">
    <div class="person">
      <img alt="image not loading" src="C:\Users\amaya\Downloads\apple-touch-icon.png" />
    </div>

    <h1>
      <span class="site-title">[{{site.username}}]</span>
    </h1>

    <div class="icons-home">
      <a
        aria-label="Instagram"
        title="Instagram"
        target="_blank"
        href="https://www.instagram.com/amay.advani/">
       IG
      </a>

      <a
        aria-label="Github"
        title="Show my projects"
        target="_blank"
        href="https://github.com/{{site.github_username}}"
      >
        <svg class="icon icon-github-alt">
          <use xlink:href="#icon-github-alt"></use>
        </svg>
      </a>

      <a
        aria-label="LinkedIn"
        title="Linkedin"
        target="_blank"
        href="https://www.linkedin.com/in/amay-advani-67a56b264/"
      >
        <svg class="icon icon-linkedin">
          <use xlink:href="#icon-linkedin"></use>
        </svg>
      </a>
    </div>

    <ul class="recent">
      <p>Posts:</p>
      {% for post in site.posts limit:3%}
      <li>
        <a
          title="Will take a my recent post"
          href="{{ post.url | prepend: site.baseurl }}"
        >
          <h2 class="post-title" itemprop="name">{{ post.title }}</h2>
        </a>
      </li>
      {% endfor %}
    </ul>

    <ul class="recent">
      <p>Projects:</p>
      {% for project in site.projects limit:3%}
      <li>
        <a title="Show my recent project" href="{{ project.url}}">
          <h2 class="post-title" itemprop="name">{{ project.name }}</h2>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% include menu-search.html %}
</header>
